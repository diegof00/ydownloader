name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Unit tests on Windows and macOS
        if: runner.os != 'Linux'
        run: pytest tests/unit
      - name: Install Linux integration tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb python3-tk
      - name: Full suite including real GUI and conversion
        if: runner.os == 'Linux'
        env:
          YDOWNLOADER_TEST_GUI: '1'
        run: xvfb-run -a pytest tests --cov=src --cov-report=term-missing
